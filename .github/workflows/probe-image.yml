name: Probe Unity image

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check GameCI images for 6000.6.8f1
        run: |
          echo "== Docker Hub tags matching 6000.6.8f1 =="
          curl -s "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=6000.6.8f1" | head -c 4000
          echo
          echo "== manifest check =="
          for t in ubuntu-6000.6.8f1-android-3 ubuntu-6000.6.8f1-base-3 ubuntu-6000.6.8f1-android-2; do
            if docker manifest inspect unityci/editor:$t >/dev/null 2>&1; then echo "$t OK"; else echo "$t MISSING"; fi
          done
          echo "== newest tags =="
          curl -s "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=15&ordering=last_updated" | head -c 3000
