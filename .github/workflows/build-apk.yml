name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.6.8f1
          targetPlatform: Android
          buildMethod: ProjectBootstrap.CiBuild.BuildApk
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Check output
        run: ls -lh Builds/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-apk
          path: Builds/*.apk
          if-no-files-found: error
